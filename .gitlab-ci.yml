# trellis-web pipeline. One repo, one runtime, so everything fits in this file.
#
#   MR pipeline      the full gate, image tagged mr<iid>-<short_sha>. Caches are read-only.
#   main pipeline    the same gate, image tagged sha-<short_sha>, then the floating `main` tag.
#                    main is the only cache writer and is never auto-cancelled.
#   other branches   run too, so a push gets feedback before the MR exists.
#
# The job scripts are the package.json scripts people run locally; nothing is reimplemented here.

stages:
  - lint
  - build
  - test
  - package

workflow:
  name: "$PIPELINE_NAME"
  # Running jobs marked `interruptible` are cancelled by a newer commit on the same ref.
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      variables:
        PIPELINE_NAME: "MR !$CI_MERGE_REQUEST_IID: $CI_MERGE_REQUEST_TITLE"
    # A branch with an open MR already gets an MR pipeline; do not run a duplicate branch pipeline.
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      auto_cancel:
        on_new_commit: none
      variables:
        PIPELINE_NAME: "main $CI_COMMIT_SHORT_SHA"
    - if: $CI_PIPELINE_SOURCE =~ /^(schedule|web|api)$/
      variables:
        PIPELINE_NAME: "$CI_PIPELINE_SOURCE on $CI_COMMIT_REF_NAME"
    - if: $CI_COMMIT_BRANCH

variables:
  PIPELINE_NAME: "branch $CI_COMMIT_REF_NAME"
  GIT_DEPTH: "50"
  FF_USE_FASTZIP: "true"
  NEXT_TELEMETRY_DISABLED: "1"
  # Pinned tool images (tag + digest). Bump tag and digest together.
  NODE_IMAGE: "node:22.23.5-trixie-slim@sha256:68c76cfad89921b927eae28ba21407475e29d0ce450afcdbe70c1532db042b64"
  DOCKER_CLI_IMAGE: "docker:29.9.3-cli@sha256:5a7af0dcb0e46c803efe9b45371dd21cb500e5b4453250394ac6f06d49b6e6f1"
  DOCKER_DIND_IMAGE: "docker:29.9.3-dind@sha256:7bf70dcb85c822e3fa6f2d332143e474b99147b9d7b39102b0cfe8b04a7dd61b"
  # @trellis/contracts comes from trellis-backend's GitLab Package Registry (decision T22). .npmrc
  # reads these; the token is $CI_JOB_TOKEN, never a literal in the repo. Set
  # TRELLIS_CONTRACTS_PROJECT_ID in Settings > CI/CD > Variables (not masked, it is not a secret).
  TRELLIS_CONTRACTS_REGISTRY_HOST: "$CI_SERVER_HOST"
  TRELLIS_CONTRACTS_TOKEN: "$CI_JOB_TOKEN"

default:
  image: $NODE_IMAGE
  interruptible: true
  retry:
    max: 2
    when: [runner_system_failure, stuck_or_timeout_failure, api_failure, scheduler_failure]

# ------------------------------------------------------------------------------------------- base
.node:
  before_script:
    - cd "$HOME"
    - npm install --global npm@11.21.3 --ignore-scripts --no-audit --no-fund
    - cd "$CI_PROJECT_DIR"
    - test "$(npm --version)" = "11.21.3"
    - npm config set cache "$CI_PROJECT_DIR/.npm"
    - npm ci --prefer-offline --strict-allow-scripts
  cache:
    key:
      prefix: npm
      files: [package-lock.json]
    paths: [.npm/]
    # Only cache:warm on main writes, so a broken MR cannot poison the cache.
    policy: pull

.rules:main:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ------------------------------------------------------------------------------------------- jobs
# The image tag, computed once and handed to later jobs as a dotenv artifact.
ci:vars:
  stage: .pre
  needs: []
  script:
    - |
      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
        IMAGE_TAG="mr${CI_MERGE_REQUEST_IID}-${CI_COMMIT_SHORT_SHA}"
      else
        IMAGE_TAG="sha-${CI_COMMIT_SHORT_SHA}"
      fi
      echo "IMAGE_TAG=$IMAGE_TAG" | tee build.env
  artifacts:
    reports:
      dotenv: build.env

lint:
  extends: .node
  stage: lint
  needs: []
  script:
    # Read only the pinned schema and compiler manifests until the contract package is published.
    - export TRELLIS_BACKEND_DIR="$(mktemp -d)"
    - node scripts/fetch-contract-inputs.mjs
    - (cd "$TRELLIS_BACKEND_DIR/contracts/codegen/typescript" && npx --yes pnpm@12.4.1 install --frozen-lockfile)
    - npm run contracts:check
    - npm run typecheck
    - npm run lint
    - npm run format:check
    # Locale parity: every key and every {placeholder} exists in vi, en and zh.
    - npm run i18n:check

build:
  extends: .node
  stage: build
  needs: []
  script:
    - npm run build
    # First Load JS per route against scripts/budget.json.
    - npm run budget:check

test:
  extends: .node
  stage: test
  needs: []
  script:
    - npm run test:coverage -- --reporter=default --reporter=junit --outputFile.junit=junit.xml
  coverage: '/^\s*Lines\s*:\s*(\d+(?:\.\d+)?)%/'
  artifacts:
    when: always
    expire_in: 7 days
    reports:
      junit: junit.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml

# Image build: Docker-in-Docker + buildx, pushed to $CI_REGISTRY_IMAGE:<IMAGE_TAG>.
#   MR    mr<iid>-<short_sha>
#   main  sha-<short_sha>, plus the floating `main` tag added by image:tag-main
.docker:
  image: $DOCKER_CLI_IMAGE
  services:
    - name: $DOCKER_DIND_IMAGE
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: /certs
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: /certs/client
  before_script:
    - until docker info >/dev/null 2>&1; do echo "waiting for dind"; sleep 1; done
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"

image:build:
  extends: .docker
  stage: package
  # lint/build/test must pass before an image exists at all.
  needs: [ci:vars, lint, build, test]
  script:
    - docker buildx create --use --driver docker-container --name trellis-web-builder >/dev/null
    # Registry build cache: every pipeline reads it, only main writes it.
    - CACHE_TO=""
    - if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then CACHE_TO="--cache-to=type=registry,ref=$CI_REGISTRY_IMAGE:buildcache,mode=max"; fi
    - >-
      docker buildx build
      --platform linux/amd64
      --tag "$CI_REGISTRY_IMAGE:$IMAGE_TAG"
      --cache-from "type=registry,ref=$CI_REGISTRY_IMAGE:buildcache"
      $CACHE_TO
      --build-arg "VERSION=$IMAGE_TAG"
      --build-arg "REVISION=$CI_COMMIT_SHA"
      --label "org.opencontainers.image.source=$CI_PROJECT_URL"
      --label "org.opencontainers.image.revision=$CI_COMMIT_SHA"
      --label "org.opencontainers.image.created=$CI_PIPELINE_CREATED_AT"
      --sbom=true
      --provenance=mode=max
      --push
      .
    - echo "pushed $CI_REGISTRY_IMAGE:$IMAGE_TAG"

# The floating tag only moves for commits on the default branch, and only after the build passed.
image:tag-main:
  extends: [.docker, .rules:main]
  stage: package
  needs: [ci:vars, image:build]
  script:
    - docker buildx imagetools create -t "$CI_REGISTRY_IMAGE:main" "$CI_REGISTRY_IMAGE:$IMAGE_TAG"

# Warms the npm cache for every other pipeline. Not a gate: a failure here must not block main.
cache:warm:npm:
  extends: [.node, .rules:main]
  stage: build
  needs: []
  cache:
    key:
      prefix: npm
      files: [package-lock.json]
    paths: [.npm/]
    policy: pull-push
  script:
    - npm cache verify
  allow_failure: true
