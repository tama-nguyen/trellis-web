name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      run_tests:
        description: Run tests (automatic PR/push runs always test)
        type: boolean
        required: true
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}

defaults:
  run:
    shell: bash

env:
  TZ: UTC

jobs:
  web:
    name: Web build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      TRELLIS_LINT_BASELINE_REF: origin/main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          cache_save: ${{ github.ref_name == github.event.repository.default_branch }}
      - name: Install pinned npm
        working-directory: ${{ runner.temp }}
        run: npm install --global "$(node -p "require(process.env.GITHUB_WORKSPACE + '/package.json').packageManager")" --ignore-scripts --no-audit --no-fund
      - name: Install locked dependencies
        run: npm ci --strict-allow-scripts
      - name: Prepare pinned backend contract inputs
        run: |
          export TRELLIS_BACKEND_DIR="$RUNNER_TEMP/trellis-backend-contracts"
          node scripts/fetch-contract-inputs.mjs
          (cd "$TRELLIS_BACKEND_DIR/contracts/codegen/typescript" && npx --yes "$(node -p "require('./package.json').packageManager")" install --frozen-lockfile)
          echo "TRELLIS_BACKEND_DIR=$TRELLIS_BACKEND_DIR" >> "$GITHUB_ENV"
      - name: Check contracts and source
        run: |
          npm run contracts:check
          npm run typecheck
          npm run lint
          npm run format:check
          npm run i18n:check
      - name: Run unit tests
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_tests }}
        run: npm run test:coverage -- --reporter=default --reporter=junit --outputFile.junit=junit.xml
      - name: Build production application
        run: npm run build
      - name: Check bundle budget
        run: npm run budget:check
      - name: Build container locally
        run: docker build --tag trellis/web:ci --build-arg VERSION=ci --build-arg REVISION="$GITHUB_SHA" .
      - name: Upload verification reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-reports
          path: |
            coverage/
            junit.xml
          if-no-files-found: ignore
          retention-days: 7
